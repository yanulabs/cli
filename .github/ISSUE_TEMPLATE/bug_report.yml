name: Bug report
description: Report a reproducible problem with cli.hpp
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal reproduction and
        avoid posting security-sensitive details here; use the security policy
        for vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the parser schema and exact argument vector.
      render: cpp
    validations:
      required: true
  - type: textarea
    id: actual-expected
    attributes:
      label: Actual and expected result
      description: Include the ParseError kind/message or stored values when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which cli.hpp release or commit are you using?
      placeholder: "1.2.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: compiler
    attributes:
      label: Compiler
      options:
        - GCC
        - Clang
        - MSVC
        - Apple Clang
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "macOS 15 arm64, Ubuntu 24.04 x86_64, Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Build flags, standard library, config/response files, or related issues.
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability, or I reported it privately.
          required: true
